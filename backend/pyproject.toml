[project]
name = "grace-city-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<6.0",
    "djangorestframework>=3.15",
    "PyMySQL>=1.1",
    "django-environ>=0.11",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.3",
    "django-filter>=24.2",
    "Pillow>=10.0",
    "celery>=5.4",
    "redis>=5.0",
    "django-redis>=5.4",
    "reportlab>=4.2",
    "qrcode>=7.4",
    "django-extensions>=3.2",
    "python-dotenv>=1.0",
]

[tool.vercel]
entrypoint = "config.wsgi:application"